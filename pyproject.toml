[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autogen-shopsavvy"
version = "0.1.0"
description = "Microsoft AutoGen tools for ShopSavvy product search and price comparison"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Monolith Technologies, Inc." },
]
keywords = ["autogen", "shopsavvy", "shopping", "price-comparison", "ai-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
]
dependencies = [
    "autogen-core>=0.4.0",
    "shopsavvy-sdk>=0.1.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/shopsavvy/autogen-shopsavvy"
Documentation = "https://shopsavvy.com/data"

[tool.hatch.build.targets.wheel]
packages = ["src/autogen_shopsavvy"]
